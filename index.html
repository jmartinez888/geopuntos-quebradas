<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Quebradas - San Juan Bautista</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Arial:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="map-dashboard">
        <!-- Panel Izquierdo: Mapa Principal -->
        <div class="main-map-panel">
            <div id="map"></div>
        </div>
        
        <!-- Panel Derecho: Mapas de Ubicación y Leyenda -->
        <div class="side-panel">
            <!-- Minimapa Perú -->
            <div class="minimap-box">
                <h3 class="minimap-title">PERÚ</h3>
                <div id="minimap-peru" class="minimap"></div>
            </div>
            
            <!-- Minimapa Loreto -->
            <div class="minimap-box">
                <h3 class="minimap-title">REGIÓN LORETO</h3>
                <div id="minimap-loreto" class="minimap"></div>
            </div>
            
            <!-- Leyenda -->
            <div class="legend-box">
                <h3 class="minimap-title">LEYENDA</h3>
                <ul class="legend-list">
                    <li><span class="legend-icon box-red"></span> Zona de muestreo</li>
                    <li><span class="legend-icon box-blue"></span> Reserva Nacional Allpahuayo-Mishana</li>
                    <li><span class="legend-icon circle-blue"></span> Puntos de colecta (Fluvial)</li>
                    <li><span class="legend-icon circle-orange"></span> Puntos de colecta (Carretera)</li>
                    <li><span class="legend-icon circle-black"></span> Centros Poblados</li>
                    <li><span class="legend-icon line-blue"></span> Quebradas y/o riachos</li>
                    <li><span class="legend-icon line-brown"></span> Carreteras</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Proj4js for coordinate conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <!-- Datos GeoJSON -->
    <script src="peru.js"></script>
    <script src="loreto.js"></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
